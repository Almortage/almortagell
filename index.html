<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="محمد عبدالجواد «المرتجل» — مصمم جرافيك ومؤسس مكتب المرتجل للدعاية والإعلان.">

  <meta name="theme-color" content="#07111f">

  <title>محمد عبدالجواد | المرتجل</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #050a12;
      --bg-light: #0a1422;
      --card: rgba(255,255,255,.055);
      --gold: #d7b56d;
      --gold-light: #f1d99b;
      --white: #f7f8fb;
      --muted: #aab5c4;
      --border: rgba(255,255,255,.10);
      --radius: 24px;
      --shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(215,181,109,.10), transparent 25%),
        radial-gradient(circle at 10% 45%, rgba(45,91,145,.12), transparent 30%),
        var(--bg);
      color: var(--white);
      line-height: 1.8;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .section {
      padding: 100px 0;
    }

    .gold {
      color: var(--gold-light);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 1000;
      transition: .3s;
    }

    header.scrolled {
      background: rgba(5,10,18,.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .logo-mark {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      color: #10151d;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 10px 35px rgba(215,181,109,.18);
    }

    .logo-text strong {
      display: block;
      font-size: 15px;
    }

    .logo-text small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      color: #ccd3dd;
      font-size: 14px;
      transition: .25s;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .menu-btn {
      display: none;
      border: 0;
      background: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      padding-top: 100px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(215,181,109,.08);
      filter: blur(90px);
      top: 5%;
      right: -10%;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 70px;
      align-items: center;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      display: inline-flex;
      padding: 8px 15px;
      border-radius: 50px;
      border: 1px solid rgba(215,181,109,.25);
      background: rgba(215,181,109,.06);
      color: var(--gold-light);
      font-size: 12px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
      margin-bottom: 25px;
      letter-spacing: -2px;
    }

    .hero h1 span {
      display: block;
      color: var(--gold-light);
    }

    .hero-sub {
      color: #dce2ea;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .hero-desc {
      color: var(--muted);
      max-width: 650px;
      margin-bottom: 30px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 23px;
      border-radius: 13px;
      border: 1px solid var(--border);
      transition: .3s;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      color: #111722;
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(215,181,109,.15);
    }

    .btn-ghost {
      background: rgba(255,255,255,.03);
    }

    .btn-ghost:hover {
      color: var(--gold-light);
      border-color: rgba(215,181,109,.45);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      margin-top: 40px;
    }

    .stat {
      padding: 18px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 18px;
    }

    .stat b {
      display: block;
      color: var(--gold-light);
      font-size: 22px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       HERO VISUAL
    ========================= */

    .hero-visual {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .portrait {
      width: min(420px, 80vw);
      aspect-ratio: 1 / 1.12;
      border-radius: 38px;
      border: 1px solid rgba(215,181,109,.30);
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(215,181,109,.18),
          transparent 45%
        ),
        linear-gradient(
          145deg,
          rgba(255,255,255,.10),
          rgba(255,255,255,.02)
        );
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

      background: url("images/profile.jpg") center/cover;
